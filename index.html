<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zesto | Shop Smart. Live Better.</title>
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Primary Meta Tags -->
  <meta name="title" content="Zesto | Shop Smart. Live Better." />
  <meta name="description"
    content="Experience the next generation of e-commerce. Discover top quality products curated exclusively for you. Shop easily, securely, and get fast delivery with Zesto." />
  <meta name="keywords"
    content="Zesto, premium online shopping, ecommerce, buy online, electronics, fashion, home essentials, luxury marketplace, fast delivery, daily deals" />
  <meta name="author" content="Zesto" />
  <meta name="theme-color" content="#020617" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zesto.com/" />
  <meta property="og:title" content="Zesto | Shop Smart. Live Better." />
  <meta property="og:description"
    content="Experience the next generation of e-commerce. Discover top quality products curated exclusively for you." />
  <meta property="og:image" content="https://zesto.com/logo.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://zesto.com/" />
  <meta property="twitter:title" content="Zesto | Shop Smart. Live Better." />
  <meta property="twitter:description"
    content="Experience the next generation of e-commerce. Discover top quality products curated exclusively for you." />
  <meta property="twitter:image" content="https://zesto.com/logo.png" />
  
  <style>
    /* Prevent white flash before React loads by setting the brand dark background */
    body {
      margin: 0;
      background-color: #020617;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script type="module" src="/src/main.jsx"></script>

</html>
